[project]
name = "file-sorting-client"
version = "0.4.3"
description = "Auto File Processor API client"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2",
    "pydantic-settings>=2",
    "rich>=13",
    "typer>=0.12",
    "pystray>=0.19",
    "pillow>=10",
]

[project.scripts]
fsc = "file_sorting_client.cli:app"
fsc-manager = "file_sorting_client.windows.manager:main"
fsc-gui = "file_sorting_client.gui:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/file_sorting_client"]

[dependency-groups]
dev = [
    "ruff>=0.8",
]
